 if(!session||!session.access_token)throw new Error('Supabase no devolvió una sesión válida.');

 const result=await supaRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloud.session.refresh_token})},cloud.config.anonKey);

function scheduleSync(){

async function syncNow(){
 clearTimeout(cloud.timer);if(!cloud.session||!cloud.loaded)return;
 if(cloud.syncPromise)return cloud.syncPromise;
 cloud.syncPromise=(async()=>{cloud.status='syncing';cloud.message='Sincronizando datos con Supabase…';renderAccount();
  try{while(cloud.session&&cloud.syncedRevision<cloud.revision){
   await refreshSession();const revision=cloud.revision,snapshot=JSON.stringify(S),userId=cloud.session.user&&cloud.session.user.id;
   if(!userId)throw new Error('La sesión no contiene un usuario válido.');
   await cloudRequest('/rest/v1/mototracker_data?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:userId,data:JSON.parse(snapshot),updated_at:new Date().toISOString()})});
   cloud.syncedRevision=revision}
   cloud.status='synced';cloud.message='Sincronizado con Supabase. Los datos están disponibles al iniciar sesión desde otro dispositivo.'}
  catch(e){cloud.status='error';cloud.message='Error al sincronizar: '+e.message;throw e}
  finally{cloud.syncPromise=null;renderAccount();if(cloud.session&&cloud.syncedRevision<cloud.revision)scheduleSync()}})();

async function loadCloudData(){

  await refreshSession();const user=cloud.session.user;

  if((user.email||'').toLowerCase()!==LOGIN_EMAIL)throw new Error('Esta aplicación solo admite la cuenta autorizada.');
  const userId=user.id;
  const rows=await cloudRequest('/rest/v1/mototracker_data?select=data&user_id=eq.'+encodeURIComponent(userId)+'&limit=1',{method:'GET'});
  cloud.loaded=true;
  if(Array.isArray(rows)&&rows.length){const remote=normalizeState(rows[0].data);S=mergeStates(remote,S);cloud.revision++;
   try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.error('No se pudo guardar la copia local descargada:',e)}
   if(JSON.stringify(S)!==JSON.stringify(remote)){cloud.syncedRevision=cloud.revision-1;await syncNow();render();return}
   cloud.syncedRevision=cloud.revision;cloud.status='synced';cloud.message='Datos cargados y sincronizados con Supabase.';render();return}
  cloud.revision++;await syncNow();render()

 (h.length?h.map((x,index)=>{const item=allItems(true).find(i=>i.id==x.id),name=item?item.n:x.id,uid=esc(x.uid);
  if(editingRegId===x.uid)return`<div class="card"><label for="editService_${uid}">Servicio</label><select id="editService_${uid}">${allItems(true).map(i=>`<option value="${i.id}"${i.id===x.id?' selected':''}>${esc(i.n)}</option>`).join('')}</select>
   <label for="editDate_${uid}">Fecha</label><input id="editDate_${uid}" type="date" value="${esc(x.d)}">
   <label for="editKm_${uid}">Odómetro (km)</label><input id="editKm_${uid}" type="number" inputmode="numeric" min="0" value="${esc(x.km)}">
   <label for="editCost_${uid}">Costo en COP</label><input id="editCost_${uid}" type="number" inputmode="numeric" min="0" value="${esc(x.cost||0)}">
   <div class="account-actions"><button class="sm" onclick="saveReg('${uid}')">Guardar</button><button class="sm ghost" onclick="cancelEditReg()">Cancelar</button></div></div>`;
  return`<div class="card"><div class="row"><span class="n">${esc(name)}</span><span class="sub">${esc(x.d)}</span></div><div class="sub">${fmt(+x.km||0)} km${x.cost?` · $${fmt(x.cost)}`:''}</div>
   <div class="account-actions"><button class="sm ghost" aria-label="Mover arriba" title="Mover arriba" ${index===0?'disabled':''} onclick="moveReg('${uid}',-1)">↑</button><button class="sm ghost" aria-label="Mover abajo" title="Mover abajo" ${index===h.length-1?'disabled':''} onclick="moveReg('${uid}',1)">↓</button><button class="sm ghost" onclick="editReg('${uid}')">Editar</button><button class="sm ghost" onclick="deleteReg('${uid}')">Borrar</button></div></div>`}).join(''):'<p class="empty">Aún no hay servicios. Registra el primero arriba.</p>')}
function newRecordId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'record-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function nextHistoryOrder(){return S.hist.reduce((max,x)=>Math.max(max,+x.order||0),-1)+1}
function setItemFromHistory(id,force){
 const current=S.items[id],entries=S.hist.filter(x=>x.id===id).sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(+a.km||0)-(+b.km||0)),latest=entries[entries.length-1];
 if(force){current.last=latest?+latest.km:null;current.date=latest?latest.d:null;return}
 if(latest&&(current.last==null||(latest.d||'')>(current.date||'')||(latest.d||'')===(current.date||'')&&(+latest.km||0)>current.last)){current.last=+latest.km;current.date=latest.d}
}
function doReg(){const id=$('#rs').value,km=+$('#rk').value,cost=+$('#rc').value||0;
 if(!(km>=0)||$('#rk').value===''||!Number.isFinite(km))return alert('Ingresa el kilometraje del odómetro.');
 if(!Number.isFinite(cost)||cost<0)return alert('Ingresa un costo válido.');
 if(km>S.odo)S.odo=km;S.items[id].last=km;S.items[id].date=today();S.hist.push({uid:newRecordId(),order:nextHistoryOrder(),d:today(),id,km,cost});save();tab='estado';render()}
function editReg(uid){editingRegId=uid;render()}
function cancelEditReg(){editingRegId=null;render()}
function saveReg(uid){
 const x=S.hist.find(r=>r.uid===uid);if(!x)return alert('No se encontró el registro que quieres editar.');
 const id=$('#editService_'+uid).value,d=$('#editDate_'+uid).value,km=+$('#editKm_'+uid).value,cost=+$('#editCost_'+uid).value;
 if(!d||!Number.isFinite(new Date(d+'T00:00:00').getTime()))return alert('Ingresa una fecha válida.');
 if($('#editKm_'+uid).value===''||!Number.isFinite(km)||km<0)return alert('Ingresa un kilometraje válido.');
 if($('#editCost_'+uid).value===''||!Number.isFinite(cost)||cost<0)return alert('Ingresa un costo válido.');
 const oldId=x.id,oldItem=S.items[oldId],oldWasCurrent=oldItem&&oldItem.last===+x.km&&oldItem.date===x.d;
 Object.assign(x,{id,d,km,cost});if(oldId!==id&&oldWasCurrent)setItemFromHistory(oldId,true);
 if(oldWasCurrent&&oldId===id)setItemFromHistory(id,true);else setItemFromHistory(id,false);
 editingRegId=null;save();render()}
function deleteReg(uid){
 const index=S.hist.findIndex(x=>x.uid===uid);if(index<0)return alert('No se encontró el registro que quieres borrar.');
 if(!confirm('¿Borrar este registro de mantenimiento?'))return;
 const [x]=S.hist.splice(index,1),item=S.items[x.id],wasCurrent=item&&item.last===+x.km&&item.date===x.d;
 if(wasCurrent)setItemFromHistory(x.id,true);if(editingRegId===uid)editingRegId=null;
 save();render()}
function moveReg(uid,direction){
 const rows=S.hist.slice().sort((a,b)=>(b.order||0)-(a.order||0)),index=rows.findIndex(x=>x.uid===uid),next=index+direction;
 if(index<0||next<0||next>=rows.length)return;
 rows.splice(next,0,rows.splice(index,1)[0]);rows.forEach((x,i)=>x.order=rows.length-i);S.hist=rows;save();render()}
function vDocs(){
 return`<h2>Documentos y legales</h2>`+DOCS.map(d=>{const v=S.docs[d.id],n=v?days(v):null;
 const lvl=n===null?'':n<=7?'crit':n<=30?'prev':'info';
 const msg=n===null?'Sin fecha registrada':n<0?`Vencido hace ${-n} días`:n===0?'Vence hoy':`Vence en ${n} días`;
 return`<div class="card"><div class="row"><span class="n">${d.n}</span>${lvl?`<span class="tag c-${lvl}">${LBL[lvl]}</span>`:''}</div>
 <div class="sub" style="margin-top:4px">${msg}</div>
 <label for="d_${d.id}">Fecha de vencimiento</label><input id="d_${d.id}" type="date" value="${v||''}" onchange="setDoc('${d.id}',this.value)"></div>`}).join('')+
 `<p class="sub">Alertas: 30 días (preventivo), 15 y 7 días (crítico a 7 o menos).</p>`}
function setDoc(id,v){S.docs[id]=v||undefined;save();render()}
function fuelStats(){const f=[...S.fuel].sort((a,b)=>a.odo-b.odo);const out=[];
 for(let i=1;i<f.length;i++){const km=f[i].odo-f[i-1].odo;if(km>0&&f[i].l>0)out.push({...f[i],kmL:km/f[i].l,km})}
 const km=out.reduce((a,x)=>a+x.km,0),l=out.reduce((a,x)=>a+x.l,0);
 return{rows:out.reverse(),avg:l?km/l:0,last:out.length?out[0].kmL:0}}
function vFuel(){const s=fuelStats();
 const cost=S.fuel.reduce((a,x)=>a+(x.l*x.price||0),0);
 return`<h2>Combustible</h2><div class="grid"><div class="card"><div class="big">${s.last?s.last.toFixed(1):'–'}</div><div class="sub">km/L último</div></div>
 <div class="card"><div class="big">${s.avg?s.avg.toFixed(1):'–'}</div><div class="sub">km/L promedio</div></div></div>
 <div class="card"><label for="fl">Litros tanqueados (máx. ${tank()})</label><input id="fl" type="number" inputmode="decimal" step="0.01" min="0" max="${tank()}">
 <label for="fp">Precio por litro (COP)</label><input id="fp" type="number" inputmode="numeric" min="0">
 <label for="fo">Odómetro (km)</label><input id="fo" type="number" inputmode="numeric" min="0" value="${S.odo}">
 <p class="sub" style="margin-top:10px">Tanquea siempre hasta llenar para que el rendimiento sea exacto.</p>
 <button onclick="doFuel()">Registrar tanqueo</button></div>
 <p class="sub">Gasto total en combustible: <b>$${fmt(cost)}</b></p>
 <h2>Rendimiento por tanqueo</h2>`+(s.rows.length?s.rows.slice(0,8).map(x=>`<div class="card row"><span class="n">${x.km} km · ${x.l} L</span><span class="big" style="font-size:24px">${x.kmL.toFixed(1)} km/L</span></div>`).join(''):'<p class="empty">Registra dos tanqueos para ver el rendimiento.</p>')}
function doFuel(){const l=+$('#fl').value,p=+$('#fp').value||0,o=+$('#fo').value;
 if(!(l>0)||l>tank())return alert('Ingresa litros entre 0 y '+tank()+' (capacidad del tanque).');
 if(!(o>=0)||$('#fo').value==='')return alert('Ingresa el kilometraje del odómetro.');
 if(o>S.odo)S.odo=o;S.fuel.push({d:today(),odo:o,l,price:p});save();render()}
function vCfg(){
 const inp=(id,l,v,fn,t)=>`<label for="${id}">${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v)}" onchange="${fn}">`;
 return`<h2>Ficha de la moto</h2><div class="card" style="padding-top:2px">`+BIKE.map(f=>inp('b_'+f[0],f[1],S.bike[f[0]],`setBike('${f[0]}',this.value)`,f[2])).join('')+`</div>
 <h2>Odómetro</h2><div class="card"><label for="co" style="margin-top:0">Odómetro actual (km)</label><input id="co" type="number" inputmode="decimal" min="0" value="${S.odo}"><button onclick="setOdo()">Actualizar odómetro</button></div>
 <h2>Especificaciones</h2><p class="sub" style="margin-bottom:10px">Valores del manual. Edítalos si cambias llantas, aceite o bujía.</p>`+
 SPECS.map((g,gi)=>`<details class="card"${gi?'':' open'}><summary>${g[0]}</summary>`+g[1].map(f=>inp('s_'+f[0],f[1],spec(f[0]),`setSpec('${f[0]}',this.value)`)).join('')+`</details>`).join('')+
 `<button class="ghost" onclick="if(confirm('¿Restaurar las especificaciones del manual?')){S.spec={};save();render()}">Restaurar valores del manual</button>
 <h2>Puntos de atención</h2><div class="card"><ul>${ATT.map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <h2>Intervalos</h2><details class="card"><summary>Editar intervalos (km)</summary>`+allItems(true).map(i=>inp('i_'+i.id,i.n,S.items[i.id].int,`setInt('${i.id}',this.value)`,'number')).join('')+`</details>
 <h2>Datos</h2><button class="ghost" onclick="exp()">Exportar copia (JSON)</button><button class="ghost" onclick="if(confirm('¿Borrar todos los datos?')){localStorage.removeItem(KEY);S=load();render()}">Borrar todo</button>`}
function setBike(k,v){S.bike[k]=v;save();updHdr()}
function setSpec(k,v){S.spec[k]=v.trim();save()}
function setOdo(){const v=parseFloat($('#co').value);if(!(v>=0)||!Number.isFinite(v))return alert('Ingresa un kilometraje válido.');S.odo=v;save();tab='estado';render()}
function setInt(id,v){v=+v;if(v>0){S.items[id].int=v;const custom=S.customItems.find(item=>item.id===id);if(custom)custom.int=v;else if(S.cardEdits[id])S.cardEdits[id].int=v;save()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='xpulse-tracker.json';a.click()}

/* ===== Trip computer GPS ===== */
let T={on:false,done:false,dist:0,max:0,secs:0,speed:0,acc:null,last:null,wid:null,tid:null,t0:0,msg:'',wakeMsg:'',wl:null};
const fmtT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function hav(a,b){const R=6371000,r=Math.PI/180,dLa=(b.latitude-a.latitude)*r,dLo=(b.longitude-a.longitude)*r;
 const x=Math.sin(dLa/2)**2+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function lockScreen(){
 if(!S.gpsKeepAwake)return;
 if(!('wakeLock' in navigator)){T.wakeMsg='Este navegador no permite mantener la pantalla encendida. El GPS con pantalla bloqueada no está garantizado.';return updTrip()}
 try{T.wl=await navigator.wakeLock.request('screen');T.wakeMsg='Pantalla activa para mejorar la continuidad del GPS.'}
 catch(e){T.wakeMsg='No se pudo mantener la pantalla encendida: '+e.message;console.error('No se pudo solicitar Wake Lock:',e)}
 updTrip()}
function unlockScreen(){
 if(T.wl){try{T.wl.release().catch(e=>{T.wakeMsg='No se pudo liberar el bloqueo de pantalla: '+e.message;console.error('No se pudo liberar Wake Lock:',e)})}
  catch(e){T.wakeMsg='No se pudo liberar el bloqueo de pantalla: '+e.message;console.error('No se pudo liberar Wake Lock:',e)}}
 T.wl=null}
function setKeepScreenAwake(enabled){S.gpsKeepAwake=enabled;S.gpsKeepAwakeSet=true;save();if(T.on){if(enabled)lockScreen();else{unlockScreen();T.wakeMsg='La pantalla puede bloquearse y el navegador podría pausar el GPS.';updTrip()}}}
document.addEventListener('visibilitychange',()=>{if(T.on&&document.visibilityState==='visible'&&S.gpsKeepAwake)lockScreen()});
function startTrip(){
 if(!navigator.geolocation){T.msg='Este navegador no tiene GPS disponible.';return updTrip()}
 Object.assign(T,{on:true,done:false,dist:0,max:0,secs:0,speed:0,acc:null,last:null,t0:Date.now(),msg:'Buscando señal GPS…',wakeMsg:''});
 T.wid=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 T.tid=setInterval(()=>{T.secs=Math.floor((Date.now()-T.t0)/1000);updTrip()},1000);
 if(S.gpsKeepAwake)lockScreen();else T.wakeMsg='La pantalla puede bloquearse y el navegador podría pausar el GPS.';
 render()}
function onErr(e){T.msg=e.code==1?'Permiso de ubicación denegado. Actívalo para este sitio en el navegador y en los ajustes del teléfono.':e.code==2?'Sin señal GPS. Busca un lugar despejado.':'La señal tarda en llegar, sigo intentando…';
 if(e.code==1)stopTrip(true);updTrip()}
function onPos(p){
 const c=p.coords;T.acc=c.accuracy;
 if(c.accuracy>30){T.msg='Señal débil (±'+Math.round(c.accuracy)+' m). Esperando mejor precisión…';return updTrip()}
 T.msg='';let v=(c.speed!=null&&!isNaN(c.speed))?c.speed:null;
 if(T.last){const dt=(p.timestamp-T.last.t)/1000,d=hav(T.last,c);if(v===null)v=dt>0?d/dt:0;
  if(v>=70){T.last={latitude:c.latitude,longitude:c.longitude,t:p.timestamp};return}
  if(v>=0.8&&d>=2)T.dist+=d}
 v=v===null?0:v;T.speed=v<0.8?0:v*3.6;T.max=Math.max(T.max,T.speed);
 T.last={latitude:c.latitude,longitude:c.longitude,t:p.timestamp};updTrip()}
function stopTrip(silent){
 if(T.wid!=null)navigator.geolocation.clearWatch(T.wid);clearInterval(T.tid);unlockScreen();
 T.on=false;T.wid=null;T.speed=0;T.done=T.dist>=10;if(!T.done&&!silent)T.msg='Recorrido muy corto para sumar (menos de 10 m).';render()}
function discardTrip(){T.done=false;T.dist=0;T.max=0;T.secs=0;T.msg='';render()}
function addTrip(){const km=T.dist/1000;S.odo=Math.round((S.odo+km)*10)/10;
 S.trips.push({d:today(),km:+km.toFixed(1),max:Math.round(T.max),secs:T.secs,type:'gps'});save();
 T.done=false;T.dist=0;T.max=0;T.secs=0;T.msg='';tab='estado';render()}
function addManualTrip(){
 const field=$('#manualKm'),km=+field.value;if(field.value===''||!Number.isFinite(km)||km<=0)return alert('Ingresa una distancia recorrida mayor que 0 km.');
 S.odo=Math.round((S.odo+km)*10)/10;S.trips.push({d:today(),km:+km.toFixed(1),max:0,secs:0,type:'manual'});save();render()}
function updTrip(){if(tab!='ruta')return;const g=i=>document.getElementById(i),message=g('tMsg'),wake=g('tWake');
 if(message)message.textContent=T.msg||(T.on&&T.acc!=null?'GPS activo · precisión ±'+Math.round(T.acc)+' m':'');
 if(wake)wake.textContent=T.wakeMsg;
 if(!g('tSpd'))return;
 g('tSpd').textContent=Math.round(T.speed);g('tDist').textContent=(T.dist/1000).toFixed(1);g('tMax').textContent=Math.round(T.max);g('tTime').textContent=fmtT(T.secs)}
function vRuta(){
 const live=T.on||T.done,km=(T.dist/1000).toFixed(1);
 const panel=`<div class="spd"><span id="tSpd">0</span><small>km/h</small></div>
 <div class="gps sub" id="tMsg" role="status"></div>
 <div class="gps sub" id="tWake" role="status">${esc(T.wakeMsg)}</div>
 <div class="stats"><div><b id="tDist">0.0</b><small>Distancia km</small></div><div><b id="tMax">0</b><small>Vel. máx. km/h</small></div><div><b id="tTime">0:00:00</b><small>Tiempo en ruta</small></div></div>`;
 const tr=S.trips.slice(-5).reverse();
 return`<h2>Odómetro de ruta</h2><div class="card"><label class="check-label"><input type="checkbox" ${S.gpsKeepAwake?'checked':''} onchange="setKeepScreenAwake(this.checked)"> Mantener pantalla encendida durante la ruta</label>
 <p class="sub" style="margin-top:8px">El GPS con pantalla bloqueada no está garantizado en una aplicación web: el navegador o el sistema pueden suspender la ubicación. Esta opción evita el bloqueo automático cuando el dispositivo lo admite.</p></div>`+(live?panel:`<div class="card"><p>Monta el celular en el manubrio y presiona iniciar. Usa el GPS del teléfono: sin datos móviles ni suscripciones.</p><div class="gps sub" id="tMsg" role="status">${esc(T.msg)}</div><div class="gps sub" id="tWake" role="status">${esc(T.wakeMsg)}</div></div>`)+
 (T.on?`<button onclick="stopTrip()">■ Detener ruta</button>`:T.done?`<button onclick="addTrip()">Sumar al Odómetro (+${km} km)</button><button class="ghost" onclick="discardTrip()">Descartar recorrido</button>`:`<button onclick="startTrip()">▶ Iniciar Ruta GPS en Vivo</button>`)+
 `<h2>Registrar kilómetros manuales</h2><div class="card"><p class="sub">Usa esto si el GPS no funcionó. La distancia se suma al odómetro actual y queda guardada como ruta manual.</p><label for="manualKm">Kilómetros recorridos</label><input id="manualKm" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="Ej. 25.5"><button onclick="addManualTrip()">Sumar kilómetros manuales</button></div>`+
 (tr.length?`<h2>Últimas rutas</h2>`+tr.map(x=>`<div class="card row"><span class="n">${x.km} km · ${x.type==='manual'?'Manual':'GPS'}</span><span class="sub">${x.type==='manual'?'':'máx. '+x.max+' km/h · '}${esc(x.d)}</span></div>`).join(''):'')}
render();initCloud();
</script>
